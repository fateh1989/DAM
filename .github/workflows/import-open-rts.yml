name: Import Open RTS base

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DAM
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import upstream working tree
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/lampe-games/godot-open-rts.git /tmp/open-rts
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          find /tmp/open-rts -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} . \;
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Open RTS MIT base"
          git push
