name: Build DAM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, battle-dev]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "source/**"
      - "assets/**"
      - "native/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dam-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: barichello/godot-ci:4.3@sha256:8d3a9fc683fcaa5b7d8b1c90fa94318402ebb00edeb5f6e2df4bac46665b98ff
    steps:
      - name: Checkout DAM
        uses: actions/checkout@v4

      - name: Upgrade DAM engine to Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail

          # Keep the exact debug signing identity used by the existing DAM builds.
          # Only the engine binary/templates are upgraded.
          test -f /root/debug.keystore
          mkdir -p /github/home/.config/godot
          cp /root/debug.keystore /github/home/debug.keystore

          # Install the official Godot 4.7.2 stable editor binary.
          cd /tmp
          wget -q --show-progress             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip             -O godot-4.7.2.zip
          unzip -q -o godot-4.7.2.zip
          install -m 0755 Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

          # Install matching 4.7.2 export templates.
          wget -q --show-progress             https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz             -O godot-4.7.2-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q -o godot-4.7.2-templates.tpz -d /tmp/godot-templates
          mkdir -p /github/home/.local/share/godot/export_templates/4.7.2.stable
          cp -a /tmp/godot-templates/templates/.             /github/home/.local/share/godot/export_templates/4.7.2.stable/

          # Godot 4.7 Android environment.
          cat > /github/home/.config/godot/editor_settings-4.7.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/github/home/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          mkdir -p build
          echo "HOME=$HOME"
          godot --version
          godot --version | grep -q '^4\.7\.2'
          java -version

          # Godot 4.7 recommended Android SDK generation.
          test -d /usr/lib/android-sdk
          # Licenses are already accepted in the CI image. Do not pipe `yes`
          # into sdkmanager under pipefail: sdkmanager can finish successfully
          # while `yes` receives SIGPIPE, producing the false exit code 141.
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"
          test -x /usr/lib/android-sdk/build-tools/35.0.1/apksigner
          test -f /github/home/debug.keystore

      - name: Battle checkpoint 01 preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "Checkpoint: battle-core-01"
          timeout 90s godot --headless --path . --script source/battle/StrategicTacticalSmoke.gd
          echo "Checkpoint battle-core-01 preflight passed"

      - name: Build DAM native C++ core
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential python3 python3-pip git
          python3 -m pip install --no-cache-dir scons

          rm -rf native/godot-cpp native/bin
          git clone --depth 1 --branch 10.0.0-stable             https://github.com/godotengine/godot-cpp.git native/godot-cpp

          scons -C native platform=linux target=template_debug arch=x86_64 -j2

          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_NDK_ROOT=/usr/lib/android-sdk/ndk/28.1.13356709
          test -d "$ANDROID_NDK_ROOT"
          scons -C native platform=android target=template_debug arch=arm64 -j2

          test -s native/bin/linux/libdam_native.linux.template_debug.x86_64.so
          test -s native/bin/android/libdam_native.android.template_debug.arm64.so
          ls -lh native/bin/linux/*.so native/bin/android/*.so

      - name: DAM Engine v2 smoke
        run: |
          godot --headless --path . --script source/EngineV2Smoke.gd

      - name: Army and combat core smoke
        run: |
          godot --headless --path . --script source/combat/ArmyCombatSmoke.gd

      - name: Clean generated Godot cache
        run: |
          rm -rf .godot

      - name: Compile 14 Syria governorate sectors
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates python3 python3-pip
          python3 -m pip install --no-cache-dir osmium pillow numpy
          mkdir -p source/world/data
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 \
            https://download.geofabrik.de/asia/syria-latest.osm.pbf \
            -o /tmp/syria.osm.pbf
          test -s /tmp/syria.osm.pbf
          python3 source/world/CompileSyria.py /tmp/syria.osm.pbf source/world/data
          test "$(find source/world/data -maxdepth 1 -name 'syria_*.json' ! -name 'syria_manifest.json' | wc -l)" -eq 14
          echo "Syria runtime data bytes: $(du -cb source/world/data/syria_*.json | tail -1 | awk '{print $1}')"

          python3 source/world/GenerateStrategicMacro.py /tmp/syria.osm.pbf source/world/generated
          python3 source/world/GenerateGeoOverlay.py /tmp/syria.osm.pbf source/world/generated/syria_geo_overlay.json
          test -s source/world/generated/syria_macro.png
          test -s source/world/generated/syria_macro_height.png
          test -s source/world/generated/syria_macro_variation.png
          test -s source/world/generated/syria_geo_overlay.json
          ls -lh source/world/generated/syria_macro*.png source/world/generated/syria_geo_overlay.json


      - name: Import project
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --import --quit
          first_status=$?
          set -e
          if [ "$first_status" -ne 0 ]; then
            echo "First import returned $first_status; retrying after generated imports settle."
            sleep 3
            godot --headless --editor --path . --import --quit
          fi

      - name: Strategic Syria macro smoke
        shell: bash
        run: |
          set -euo pipefail
          test -s source/world/generated/syria_macro.png
          test -s source/world/generated/syria_macro_height.png
          test -s source/world/generated/syria_macro_variation.png
          godot --headless --path . --script source/world/StrategicViewSmoke.gd

      - name: Strategic geography and battle-entry smoke
        shell: bash
        run: |
          set -euo pipefail
          test -s source/world/generated/syria_geo_overlay.json
          godot --headless --path . --script source/world/GeoOverlaySmoke.gd

      - name: DAM Native Core smoke
        shell: bash
        run: |
          set -euo pipefail
          test -s native/bin/linux/libdam_native.linux.template_debug.x86_64.so
          test -f native/dam_native.gdextension
          godot --headless --path . --script source/NativeCoreSmoke.gd

      - name: Smoke test real terrain scene
        run: |
          godot --headless --path . res://source/world/MiddleEastTerrain.tscn --quit-after 90

      - name: Validate terrain vector scene
        run: |
          timeout 12s godot --headless --path . res://source/world/MiddleEastTerrain.tscn || test $? -eq 124

      - name: Syria 14-sector data smoke
        run: godot --headless --path . --script source/world/SyriaDataSmoke.gd

      - name: Aleppo terrain runtime smoke
        run: godot --headless --path . --script source/world/AleppoSmoke.gd

      - name: Persistent units and RTS/map view smoke
        run: godot --headless --path . --script source/world/UnitStateSmoke.gd

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          test -d "$GITHUB_WORKSPACE/build"
          godot --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" "$GITHUB_WORKSPACE/build/DAM.apk"

      - name: Verify APK
        run: |
          test -s build/DAM.apk
          ls -lh build/DAM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAM-Android-debug
          path: build/DAM.apk
          if-no-files-found: error
