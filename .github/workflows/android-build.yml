name: Build DAM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "source/**"
      - "assets/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout DAM
        uses: actions/checkout@v4

      - name: Restore Godot Android environment
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates
          cp -a /root/.local/share/godot/export_templates/4.3.stable /github/home/.local/share/godot/export_templates/
          mkdir -p /github/home/.config/godot
          cp /root/.config/godot/editor_settings-4.3.tres /github/home/.config/godot/editor_settings-4.3.tres
          cp /root/debug.keystore /github/home/debug.keystore
          sed -i 's#/root/debug.keystore#/github/home/debug.keystore#g' /github/home/.config/godot/editor_settings-4.3.tres
          mkdir -p build
          echo "HOME=$HOME"
          java -version
          test -d /usr/lib/android-sdk
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"
          test -x /usr/lib/android-sdk/build-tools/34.0.0/apksigner
          test -f /github/home/debug.keystore

      - name: Clean generated Godot cache
        run: |
          rm -rf .godot

      - name: Fetch Aleppo real-world vector data
        shell: bash
        run: |
          if ! command -v curl >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates
          fi
          mkdir -p source/world/data
          cat > /tmp/aleppo.overpass <<'EOF'
          [out:json][timeout:45];
          (
            way["highway"](36.190,37.145,36.212,37.180);
            way["waterway"](36.190,37.145,36.212,37.180);
            way["natural"="water"](36.190,37.145,36.212,37.180);
            node["place"~"city|town|village|hamlet|suburb|neighbourhood"](36.190,37.145,36.212,37.180);
            way["building"](36.195,37.150,36.207,37.172);
          );
          out geom 3500;
          EOF
          curl --fail --retry 1 --connect-timeout 12 --max-time 60             --data-urlencode "data@/tmp/aleppo.overpass"             https://overpass-api.de/api/interpreter             -o source/world/data/aleppo_osm.json           || curl --fail --retry 1 --connect-timeout 12 --max-time 60             --data-urlencode "data@/tmp/aleppo.overpass"             https://overpass.kumi.systems/api/interpreter             -o source/world/data/aleppo_osm.json
          test -s source/world/data/aleppo_osm.json
          test "$(wc -c < source/world/data/aleppo_osm.json)" -gt 5000
          echo "Aleppo OSM bytes: $(wc -c < source/world/data/aleppo_osm.json)"

      - name: Import project
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --import --quit
          first_status=$?
          set -e
          if [ "$first_status" -ne 0 ]; then
            echo "First import returned $first_status; retrying after generated imports settle."
            sleep 3
            godot --headless --editor --path . --import --quit
          fi

      - name: Smoke test real terrain scene
        run: |
          godot --headless --path . res://source/world/MiddleEastTerrain.tscn --quit-after 90

      - name: Validate terrain vector scene
        run: |
          timeout 12s godot --headless --path . res://source/world/MiddleEastTerrain.tscn || test $? -eq 124

      - name: Aleppo terrain runtime smoke
        run: godot --headless --path . --script source/world/AleppoSmoke.gd

      - name: Export APK
        run: godot --headless --path . --export-debug "Android" build/DAM.apk

      - name: Verify APK
        run: |
          test -s build/DAM.apk
          ls -lh build/DAM.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAM-Android-debug
          path: build/DAM.apk
          if-no-files-found: error
